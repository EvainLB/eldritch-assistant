    - assets/cards/hijos_yuggoth/
    - assets/cards/hijos_yuggoth/reversos/
    - assets/cards/hijos_yuggoth/misterios/
    - assets/cards/hijos_yuggoth/aventuras/
    - assets/primigenios/hijos_yuggoth/
    - assets/cards/montanas_locura/
    - assets/cards/montanas_locura/reversos/
    - assets/cards/montanas_locura/mitos/
    - assets/cards/montanas_locura/preludios/
    - assets/cards/montanas_locura/misterios/
