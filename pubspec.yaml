    - assets/cards/tierras_sueno/preludios/
    - assets/cards/tierras_sueno/misterios/
    - assets/cards/tierras_sueno/aventuras/
    - assets/primigenios/tierras_sueno/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
    - family: Garamond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
